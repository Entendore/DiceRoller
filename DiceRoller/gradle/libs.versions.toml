[versions]
agp = "8.5.2"
kotlin = "2.0.20"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
recyclerview = "1.3.2"
lifecycle = "2.8.5"
coroutines = "1.9.0"
datastore = "1.1.1"
serializationJson = "1.7.2"
playReview = "2.0.2"
junit = "4.13.2"
robolectric = "4.13"
androidxTestCore = "1.6.1"
androidxTestJunit = "1.2.1"
androidxTestRules = "1.6.1"
espresso = "3.6.1"
uiautomator = "2.3.0"
leakcanary = "2.14"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
